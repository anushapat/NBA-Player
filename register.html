
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Hub | Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">🏀 NBA <span>PLAYER HUB</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#players">Players</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="nav-button active">Sign Up</a>
    </nav>
</header>

<main class="auth-section">
    <div class="auth-card">
        <div class="auth-icon">🏀</div>
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create an Account</h1>
        <p class="auth-description">
            Create your account to join NBA Player Hub.
        </p>

        <form id="registerForm">
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="registerEmail">Email Address</label>
            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label for="registerPassword">Password</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                required
            >

            <button type="submit" class="auth-button">
                Create Account
            </button>

            <p id="registerMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</main>

<footer>
    <p>🏀 NBA Player Hub | IT342 Cloud Administration Project</p>
</footer>

</body>
</html>
