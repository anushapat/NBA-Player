
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Hub | Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">🏀 NBA <span>PLAYER HUB</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#players">Players</a>
        <a href="login.html" class="active">Login</a>
        <a href="register.html" class="nav-button">Sign Up</a>
    </nav>
</header>

<main class="auth-section">
    <div class="auth-card">
        <div class="auth-icon">🏀</div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login to Your Account</h1>
        <p class="auth-description">
            Sign in to join the NBA Player Hub community.
        </p>

        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="auth-button">Login</button>
            <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</main>

<footer>
    <p>🏀 NBA Player Hub | IT342 Cloud Administration Project</p>
</footer>

</body>
</html>
